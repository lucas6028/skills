<!DOCTYPE html>
<!--
  illustrated-explainer template.
  Fill in every {{PLACEHOLDER}}. All figures must be inlined as base64 data URIs
  (use scripts/fig_to_datauri.py) so the file is a single portable .html.
  Math: write LaTeX in \( ... \) (inline) or \[ ... \] / $$ ... $$ (display) — KaTeX auto-render handles it.
  Code: <pre><code class="language-python"> ... </code></pre> — highlight.js handles it.
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>

<!-- KaTeX (math). CDN is fine for a local .html file. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- highlight.js (code) — Solarized Light to match the page palette -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/base16/solarized-light.min.css">
<script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

<style>
  /* ===== Solarized Light palette — single unified light theme =====
     bg base3 #fdf6e3 / panel+code base2 #eee8d5 / body base01 #586e75 / muted base1 #93a1a1 / border #ddd6c3
     accents: blue #268bd2, cyan #2aa198, yellow #b58900, red #dc322f, magenta #d33682, green #859900 */
  :root{
    color-scheme: light;
    --bg:#fdf6e3; --fg:#586e75; --muted:#93a1a1; --border:#ddd6c3;
    --accent:#268bd2; --accent-soft:#eee8d5;
    --callout-tip:#2aa198; --callout-tip-bg:#e7f3f1;
    --callout-key:#b58900; --callout-key-bg:#f6eed8;
    --callout-warn:#dc322f; --callout-warn-bg:#fbe7e4;
    --code-bg:#eee8d5;
    --maxw:760px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:17px; line-height:1.85; letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw); margin:0 auto; padding:48px 20px 120px}
  header.hero{margin-bottom:8px}
  .kicker{color:var(--accent); font-weight:700; font-size:.82rem; letter-spacing:.12em; text-transform:uppercase}
  h1{font-size:2.1rem; line-height:1.25; margin:.3em 0 .2em; letter-spacing:-.01em}
  .tldr{
    background:var(--accent-soft); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:10px; padding:16px 18px; margin:24px 0; font-size:1.02rem;
  }
  .tldr b{color:var(--accent)}
  .meta{color:var(--muted); font-size:.9rem; margin:.4em 0 0}

  h2{font-size:1.5rem; margin:2.4em 0 .6em; padding-top:.3em; border-top:1px solid var(--border)}
  h2:first-of-type{border-top:none}
  h3{font-size:1.18rem; margin:1.8em 0 .5em}
  p{margin:1em 0}
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}
  ul,ol{padding-left:1.4em} li{margin:.35em 0}
  strong{font-weight:700}
  hr{border:none; border-top:1px solid var(--border); margin:2.4em 0}

  /* Figures */
  figure{margin:28px 0; text-align:center}
  figure img, figure svg{max-width:100%; height:auto; border-radius:8px}
  figure.bordered img{border:1px solid var(--border); background:#ffffff; padding:8px}
  figcaption{color:var(--muted); font-size:.86rem; margin-top:10px; line-height:1.6}
  figcaption .src{font-style:italic}

  /* Callouts */
  .callout{border-radius:10px; padding:14px 16px; margin:22px 0; border:1px solid var(--border); border-left-width:4px}
  .callout .tag{font-weight:700; font-size:.82rem; letter-spacing:.05em; display:block; margin-bottom:4px}
  .callout p:first-child{margin-top:0} .callout p:last-child{margin-bottom:0}
  .callout.tip{background:var(--callout-tip-bg); border-left-color:var(--callout-tip)}
  .callout.tip .tag{color:var(--callout-tip)}
  .callout.key{background:var(--callout-key-bg); border-left-color:var(--callout-key)}
  .callout.key .tag{color:var(--callout-key)}
  .callout.warn{background:var(--callout-warn-bg); border-left-color:var(--callout-warn)}
  .callout.warn .tag{color:var(--callout-warn)}

  /* Code */
  pre{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:16px; overflow-x:auto; margin:22px 0}
  pre code{font-family:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace; font-size:.88rem; line-height:1.6; background:none; padding:0}
  /* let the pre's --code-bg show uniformly; atom-one-dark sets .hljs bg otherwise */
  pre code.hljs{background:transparent; padding:0}
  :not(pre)>code{background:var(--code-bg); border:1px solid var(--border); border-radius:5px; padding:.1em .4em; font-size:.88em; font-family:"JetBrains Mono",Consolas,monospace}

  /* Tables */
  .table-scroll{overflow-x:auto; margin:22px 0}
  table{border-collapse:collapse; width:100%; font-size:.95rem}
  th,td{border:1px solid var(--border); padding:9px 12px; text-align:left}
  th{background:var(--code-bg); font-weight:700}

  /* KaTeX display blocks scroll on mobile instead of overflowing */
  .katex-display{overflow-x:auto; overflow-y:hidden; padding:4px 0}

  /* TOC */
  nav.toc{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:14px 18px 14px 20px; margin:24px 0}
  nav.toc .toc-title{font-weight:700; font-size:.9rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px}
  nav.toc ol{margin:0; padding-left:1.2em} nav.toc li{margin:.2em 0}
  nav.toc a{color:var(--fg)}

  /* References */
  .refs{font-size:.9rem; color:var(--muted)}
  .refs li{margin:.5em 0}

  footer{margin-top:60px; padding-top:20px; border-top:1px solid var(--border); color:var(--muted); font-size:.85rem}
</style>
</head>
<body>
<article class="wrap">

  <header class="hero">
    <div class="kicker">{{KICKER}}</div>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
    <div class="tldr"><b>一句話：</b>{{TLDR}}</div>
  </header>

  <nav class="toc">
    <div class="toc-title">目錄</div>
    <ol>
      {{TOC_ITEMS}}
    </ol>
  </nav>

  {{BODY}}

  <h2 id="refs">參考資料</h2>
  <ol class="refs">
    {{REFERENCES}}
  </ol>

  <footer>{{FOOTER}}</footer>
</article>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\[", right: "\\]", display: true},
        {left: "\\(", right: "\\)", display: false},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  }
  if (window.hljs) hljs.highlightAll();
});
</script>
</body>
</html>
